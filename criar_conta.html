<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD DIGITAL</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!--  Tela de Login-->
    <div class="login-box">
    <h1>Crie sua conta</h1>
    <div class="barra-horizontal"></div>

    <form>
      <div class="input-box">
        <p class="email1">Seu email</p>
        <input type="email" placeholder="Digite seu email" required>
      </div>

      <div class="input-box">
        <p class="senha">Sua senha</p>
        <input type="password" placeholder="Digite sua senha" required>
      </div>

    
      <button type="submit" class="btn-login">
        Criar conta
      </button>
    </form>

    <div class="cadastro">
      Já possui conta?
      <a href="login.html">Entrar</a>
    </div>
  </div>

    <!--  Rodapé -->  
  <footer class="rodape">
  <div class="rodape-conteudo">
    <h2>SD DIGITAL</h2>

    <p>Sua solução digital em um só lugar</p>

    <div class="rodape-links">
      <a href="#">Início</a>
      <a href="#">Produtos</a>
      <a href="#">Contato</a>
    </div>

    <p class="copyright">
      © 2026 SD DIGITAL - Todos os direitos reservados.
    </p>
  </div>
</footer>
</body>
</html>
